<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opera GX – Gaming Browser</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="https://www.opera.com/favicon.ico">
</head>
<body class="browser-body">

    <!-- Opera GX Top-Bar (getarnt) -->
    <div class="top-bar">
        <div class="top-bar-left">
            <img src="https://www.opera.com/static/images/gx/gx-logo-white.843f9e0e5e1a.svg" alt="Opera GX" class="top-logo">
            <span class="top-title">Opera GX</span>
        </div>
        <div class="top-bar-center">
            <span id="fach-titel" class="fach-anzeige">GX Browser</span>
        </div>
        <div class="top-bar-right">
            <a href="index.html" class="home-button">🏠</a>
        </div>
    </div>

    <!-- Adressleiste (getarnt) -->
    <div class="address-bar">
        <span class="lock-icon">🔒</span>
        <span class="url-text">opera://gx</span>
    </div>

    <!-- Hauptbereich -->
    <div class="browser-content">
        <h2 id="fach-unterschrift">Willkommen im Opera GX Browser</h2>
        <p>Der ultimative Gaming-Browser.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
