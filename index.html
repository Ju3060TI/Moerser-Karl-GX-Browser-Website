<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>404 Not Found</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial;background:#f5f5f5;height:100vh;display:flex;justify-content:center;align-items:center;user-select:none}
        .error-box{text-align:center;color:#333}
        .error-code{font-size:120px;font-weight:bold;color:#c00;text-shadow:2px 2px 4px rgba(0,0,0,.2)}
        .error-text{font-size:24px;margin:10px 0}
        .error-sub{font-size:14px;color:#666}
        .dot{display:inline-block;width:8px;height:8px;background:#c00;border-radius:50%;margin:0 2px;animation:blink 1.5s infinite;cursor:pointer}
        .dot:nth-child(2){animation-delay:.2s}
        .dot:nth-child(3){animation-delay:.4s}
        @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-code">404</div>
        <div class="error-text">Seite nicht gefunden<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
        <div class="error-sub">Die angeforderte URL wurde nicht gefunden.</div>
    </div>
    <script>
        let c=0;document.querySelectorAll('.dot').forEach(d=>d.addEventListener('click',()=>{c++;if(c>=5)location.href='/browser.html'}));
        let k=[];document.addEventListener('keydown',e=>{k.push(e.key);k=k.slice(-8);if(k.join(',')==='ArrowUp,ArrowUp,ArrowDown,ArrowDown,ArrowLeft,ArrowRight,ArrowLeft,ArrowRight')location.href='/browser.html'});
        let w='';document.addEventListener('keypress',e=>{w+=e.key.toLowerCase();if(w.includes('moerser')){w='';location.href='/browser.html'};if(w.length>20)w=w.slice(-10)});
    </script>
</body>
</html>
