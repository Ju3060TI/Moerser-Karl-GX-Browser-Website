<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>404 Not Found</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#f5f5f5;height:100vh;display:flex;justify-content:center;align-items:center;user-select:none}
        .hidden{display:none}
        
        .error-box{text-align:center;color:#333}
        .error-code{font-size:120px;font-weight:bold;color:#c00;text-shadow:2px 2px 4px rgba(0,0,0,.2)}
        .error-text{font-size:24px;margin:10px 0}
        .error-sub{font-size:14px;color:#666}
        .dot{display:inline-block;width:8px;height:8px;background:#c00;border-radius:50%;margin:0 2px;animation:blink 1.5s infinite;cursor:pointer}
        .dot:nth-child(2){animation-delay:.2s}
        .dot:nth-child(3){animation-delay:.4s}
        @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
        .hint{font-size:10px;color:#999;margin-top:30px}
        
        .container{text-align:center;background:#fff;padding:40px;border-radius:15px;box-shadow:0 5px 30px rgba(0,0,0,.1);max-width:550px;width:90%}
        h1{color:#333;margin-bottom:5px;font-size:24px}
        .subtitle{color:#666;margin-bottom:20px;font-size:13px}
        .fach-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px;text-align:left}
        .fach-btn{padding:12px;border:2px solid #ddd;border-radius:8px;cursor:pointer;font-size:14px;background:#fff;transition:all .2s;display:flex;align-items:center;gap:8px}
        .fach-btn:hover{background:#e8f5e9;border-color:#4caf50;transform:scale(1.02)}
        .fach-btn:active{background:#c8e6c9}
        .info-box{background:#e8f5e9;padding:12px;border-radius:8px;font-size:13px;color:#2e7d32;margin:15px 0;text-align:center;min-height:40px;border:2px solid #4caf50}
        .note{font-size:10px;color:#bbb;margin-top:15px}
    </style>
</head>
<body>
    <!-- 404 Tarnung -->
    <div id="tarnung">
        <div class="error-box">
            <div class="error-code">404</div>
            <div class="error-text">Seite nicht gefunden<span class="dot" id="d1"></span><span class="dot" id="d2"></span><span class="dot" id="d3"></span></div>
            <div class="error-sub">Die angeforderte URL wurde nicht gefunden.</div>
            <p class="hint">nginx/1.24.0</p>
        </div>
    </div>
    
    <!-- Fach-Auswahl -->
    <div id="fachAuswahl" class="hidden">
        <div class="container">
            <h1>📚 Schulhelfer 2.0</h1>
            <p class="subtitle">Wähle dein Fach:</p>
            <div class="fach-grid">
                <div class="fach-btn" onclick="openFach()">📐 Mathe</div>
                <div class="fach-btn" onclick="openFach()">📝 Deutsch</div>
                <div class="fach-btn" onclick="openFach()">🇬🇧 Englisch</div>
                <div class="fach-btn" onclick="openFach()">🏛️ Geschichte</div>
                <div class="fach-btn" onclick="openFach()">💻 Informatik</div>
                <div class="fach-btn" onclick="openFach()">🧬 Biologie</div>
                <div class="fach-btn" onclick="openFach()">🎨 Kunst</div>
                <div class="fach-btn" onclick="openFach()">📐 GZ</div>
                <div class="fach-btn" onclick="openFach()">🍳 EHH</div>
                <div class="fach-btn" onclick="openFach()">🤝 DGB</div>
                <div class="fach-btn" onclick="openFach()">🫂 Soz</div>
            </div>
            <div class="info-box" id="infoBox">👆 Klick auf ein Fach um es zu öffnen</div>
            <p class="note">© 2024 Schulhelfer 2.0</p>
        </div>
    </div>

    <script>
        let clicks = 0;
        document.getElementById('d1').addEventListener('click',function(e){e.stopPropagation();clicks++;if(clicks>=5)showAuswahl()});
        document.getElementById('d2').addEventListener('click',function(e){e.stopPropagation();clicks++;if(clicks>=5)showAuswahl()});
        document.getElementById('d3').addEventListener('click',function(e){e.stopPropagation();clicks++;if(clicks>=5)showAuswahl()});
        
        let k=[];
        document.addEventListener('keydown',function(e){k.push(e.key);k=k.slice(-8);if(k.join(',')==='ArrowUp,ArrowUp,ArrowDown,ArrowDown,ArrowLeft,ArrowRight,ArrowLeft,ArrowRight')showAuswahl()});
        
        let w='';
        document.addEventListener('keypress',function(e){w+=e.key.toLowerCase();if(w.includes('moerser')){w='';showAuswahl()}if(w.length>20)w=w.slice(-10)});
        
        function showAuswahl(){
            document.getElementById('tarnung').classList.add('hidden');
            document.getElementById('fachAuswahl').classList.remove('hidden');
        }
        
        function openFach(){
            document.getElementById('infoBox').innerHTML='✅ Lade Browser...';
            window.location.href = 'browser.html';
        }
    </script>
</body>
</html>
