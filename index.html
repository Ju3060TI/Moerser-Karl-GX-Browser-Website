<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moerser-Karl-GX-Browser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="logo.png" alt="Moerser-Karl-GX-Browser Logo" class="logo-img">
        </div>

        <h1 class="title">Moerser-Karl-GX-Browser</h1>
        <p class="subtitle">Dein Schulbrowser für alle Fächer</p>

        <!-- Fach-Auswahl -->
        <div class="subject-selection">
            <label for="subject-select">Fach wählen:</label>
            <select id="subject-select">
                <option value="mathe">Mathe</option>
                <option value="deutsch">Deutsch</option>
                <option value="englisch">Englisch</option>
                <option value="geschichte">Geschichte</option>
                <option value="biologie">Biologie</option>
                <option value="physik">Physik</option>
                <option value="chemie">Chemie</option>
                <option value="turnen">Turnen</option>
                <option value="soz">Soz</option>
                <option value="freistunde">Freistunde</option>
                <option value="digitale-grundbildung">Digitale Grundbildung</option>
                <option value="musik">Musik</option>
            </select>
        </div>

        <!-- Start-Button -->
        <a id="start-browser" href="#" class="start-button">Moerser-Karl-GX-Browser starten</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
