<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schulhelfer 2.0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="https://www.opera.com/favicon.ico">
</head>
<body>
    <div class="container">
        <!-- Opera GX Logo -->
        <div class="logo">
            <img src="https://www.opera.com/static/images/gx/gx-logo-white.843f9e0e5e1a.svg" alt="Opera GX Logo" class="logo-img">
        </div>

        <h1 class="title">Opera GX</h1>
        <p class="subtitle">Der Browser für Gamer</p>

        <div class="features">
            <div class="feature">
                <span class="feature-icon">🎮</span>
                <span>CPU- & RAM-Limiter</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🎵</span>
                <span>Integrierte Musik-Player</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🎨</span>
                <span>RGB-Beleuchtung</span>
            </div>
        </div>

        <!-- Fach-Auswahl (getarnt als "Erweiterungen" oder "Add-ons") -->
        <div class="subject-selection">
            <label for="subject-select">Erweiterungen:</label>
            <select id="subject-select">
                <option value="mathe">Mathe</option>
                <option value="deutsch">Deutsch</option>
                <option value="englisch">Englisch</option>
                <option value="geschichte">Geschichte</option>
                <option value="biologie">Biologie</option>
                <option value="physik">Physik</option>
                <option value="chemie">Chemie</option>
                <option value="turnen">Turnen</option>
                <option value="soz">Soz</option>
                <option value="freistunde">Freistunde</option>
                <option value="digitale-grundbildung">Digitale Grundbildung</option>
                <option value="musik">Musik</option>
            </select>
        </div>

        <!-- Download-Button (führt zu browser.html) -->
        <a id="start-browser" href="#" class="download-button">Opera GX herunterladen</a>

        <p class="version">Version 106.0.4998.28 – Early Bird</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
